name: Build for All Platforms

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Windows executable (One-file)
      run: |
        pyinstaller --onefile --name zesigen-windows-${{ matrix.python-version }} src/zesigen.py
        dir dist

    - name: Build Windows executable (Folder)
      run: |
        pyinstaller --name zesigen-windows-folder-${{ matrix.python-version }} src/zesigen.py
        dir dist

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zesigen-windows-py${{ matrix.python-version }}
        path: |
          dist/zesigen-windows-${{ matrix.python-version }}.exe
          dist/zesigen-windows-folder-${{ matrix.python-version }}/**

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.8']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Build macOS executable (One-file)
      run: |
        pyinstaller --onefile --name zesigen-macos-${{ matrix.python-version }} src/zesigen.py
        ls -la dist/

    - name: Build macOS executable (Folder)
      run: |
        pyinstaller --name zesigen-macos-folder-${{ matrix.python-version }} src/zesigen.py
        ls -la dist/

    - name: Create macOS app bundle
      run: |
        pyinstaller --windowed --name "Zesigen" --icon=assets/icon.icns src/zesigen.py 2>/dev/null || true
        if [ -d "dist/Zesigen.app" ]; then
          echo "App bundle created successfully"
        fi

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zesigen-macos-py${{ matrix.python-version }}
        path: |
          dist/zesigen-macos-${{ matrix.python-version }}
          dist/zesigen-macos-folder-${{ matrix.python-version }}/**

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev python3-pip python3-venv

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt

    - name: Build Linux executable (One-file)
      run: |
        pyinstaller --onefile --name zesigen-linux-${{ matrix.python-version }} src/zesigen.py
        chmod +x dist/zesigen-linux-${{ matrix.python-version }}
        ls -la dist/

    - name: Build Linux executable (Folder)
      run: |
        pyinstaller --name zesigen-linux-folder-${{ matrix.python-version }} src/zesigen.py
        chmod +x dist/zesigen-linux-folder-${{ matrix.python-version }}/zesigen-linux-folder-${{ matrix.python-version }}
        ls -la dist/

    - name: Create AppImage (optional)
      run: |
        # This would require additional setup for AppImage creation
        echo "AppImage creation would require additional tools"

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zesigen-linux-py${{ matrix.python-version }}
        path: |
          dist/zesigen-linux-${{ matrix.python-version }}
          dist/zesigen-linux-folder-${{ matrix.python-version }}/**

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Display structure of downloaded files
      run: ls -R

    - name: Create release archive
      run: |
        mkdir -p release
        # Copy all executables to release folder
        find . -name "*.exe" -type f -exec cp {} release/ \;
        find . -name "zesigen-*" -type f -executable -exec cp {} release/ \;

        # Create zip archives
        cd release
        for file in *; do
          if [ -f "$file" ]; then
            zip "${file}.zip" "$file"
          fi
        done
        ls -la

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*.zip
        generate_release_notes: TRUE
