name: Quick Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'windows'
        type: choice
        options:
        - windows
        - macos
        - linux
      python_version:
        description: 'Python version'
        required: true
        default: '3.10'
        type: choice
        options:
        - '3.8'
        - '3.9'
        - '3.10'
        - '3.11'

jobs:
  quick-build:
    runs-on: ${{ github.event.inputs.platform == 'windows' && 'windows-latest' || github.event.inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ github.event.inputs.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ github.event.inputs.python_version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        if [ "${{ github.event.inputs.platform }}" = "windows" ]; then
          pyinstaller --onefile --name zesigen src/zesigen.py
          echo "Executable: dist/zesigen.exe"
          dir dist
        else
          pyinstaller --onefile --name zesigen src/zesigen.py
          chmod +x dist/zesigen
          echo "Executable: dist/zesigen"
          ls -la dist
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zesigen-${{ github.event.inputs.platform }}-py${{ github.event.inputs.python_version }}
        path: dist/